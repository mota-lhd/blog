version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      front:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      back:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/frontend/src"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      front:
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      back:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directories:
      - "/.github/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"