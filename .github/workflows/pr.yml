name: "Pull-Request"

on:
  pull_request:
    types: [synchronize, opened, reopened]

permissions:
  contents: read

jobs:
  secrets:
    name: secrets/scan
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - name: trufflehog
      uses: trufflesecurity/trufflehog@4ef51f69ca6347aaa76a5e64a87eac9c0c909f71 # v3.100.1
      with:
        extra_args: --results=verified,unknown

  changes:
    needs: secrets
    name: changes/detect
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      backend_dockerfile: ${{ steps.changes.outputs.backend_dockerfile }}
      backend_python: ${{ steps.changes.outputs.backend_python }}
      frontend: ${{ steps.changes.outputs.frontend }}
      frontend_dockerfile: ${{ steps.changes.outputs.frontend_dockerfile }}
      frontend_js: ${{ steps.changes.outputs.frontend_js }}
      actions: ${{ steps.changes.outputs.actions }}
    steps:
    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - name: changes
      uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      id: changes
      with:
        filters: .github/file_and_dir_filters.yml

  backend:
    needs: changes
    name: backend/scan
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - name: dockerfile/scan
      uses: bridgecrewio/checkov-action@b782b35c8411ff565b881fba67ceebdb426d7dc4 # v3.4.11
      if: ${{ needs.changes.outputs.backend_dockerfile == 'true' }}
      with:
        output_format: cli
        output_file_path: console
        file: './backend/Dockerfile'
        framework: "dockerfile"
        quiet: true
    - name: docker/setup
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: docker/build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: './backend/'
        push: false
        tags: local/web:back
        cache-from: type=gha
        cache-to: type=gha,mode=max
        outputs: type=docker
    - name: image/scan
      id: backend_scan
      uses: anchore/scan-action@11983a512817154c80a9db660c1a184be7513ed6 # v7.4.3
      with:
        image: 'local/web:back'
        fail-build: true
        output-format: table
        severity-cutoff: high
        only-fixed: true
        config: .github/grype.yaml

  frontend:
    needs: changes
    name: frontend/scan
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - name: dockerfile/scan
      uses: bridgecrewio/checkov-action@b782b35c8411ff565b881fba67ceebdb426d7dc4 # v3.4.11
      if: ${{ needs.changes.outputs.frontend_dockerfile == 'true' }}
      with:
        output_format: cli
        output_file_path: console
        file: './frontend/Dockerfile'
        framework: "dockerfile"
        quiet: true
    - name: docker/setup
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: docker/build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: './frontend/'
        push: false
        tags: local/web:front
        cache-from: type=gha
        cache-to: type=gha,mode=max
        outputs: type=docker
    - name: image/scan
      id: frontend_scan
      uses: anchore/scan-action@11983a512817154c80a9db660c1a184be7513ed6 # v7.4.3
      with:
        image: 'local/web:front'
        fail-build: true
        output-format: table
        severity-cutoff: high
        only-fixed: true
        config: .github/grype.yaml

  opengrep:
    needs: changes
    name: opengrep/scan
    if: ${{ needs.changes.outputs.backend_python == 'true' || needs.changes.outputs.frontend_js == 'true' || needs.changes.outputs.actions == 'true' }}
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - name: opengrep
      env:
        OPENGREP_VERSION: v2.1.0
        GH_TOKEN: ${{ github.token }}
        BACKEND_CHANGED: ${{ needs.changes.outputs.backend_python }}
        FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend_js }}
        ACTIONS_CHANGED: ${{ needs.changes.outputs.actions }}
      run: |
        mkdir -p "$RUNNER_TEMP/opengrep"
        curl -fsSL \
          -o "$RUNNER_TEMP/opengrep/opengrep" \
          "https://github.com/opengrep/opengrep/releases/download/${OPENGREP_VERSION}/opengrep_linux_x86"
        chmod +x "$RUNNER_TEMP/opengrep/opengrep"

        if [[ "$BACKEND_CHANGED" == "true" ]]; then
          "$RUNNER_TEMP/opengrep/opengrep" ci \
            --taint-intrafile \
            --include 'backend/**/*.py'
        fi
        if [[ "$FRONTEND_CHANGED" == "true" ]]; then
          "$RUNNER_TEMP/opengrep/opengrep" ci \
            --taint-intrafile \
            --include 'frontend/**/*.js' \
            --include 'frontend/**/*.mjs' \
            --include 'frontend/**/*.html'
        fi
        if [[ "$ACTIONS_CHANGED" == "true" ]]; then
          "$RUNNER_TEMP/opengrep/opengrep" ci \
            --taint-intrafile \
            --include '.github/workflows/**/*.yml' \
            --include '.github/workflows/**/*.yaml' \
            --include '.github/dependabot.yml'
        fi

  success:
    runs-on: ubuntu-slim
    needs: [backend, frontend, opengrep]
    if: always()
    steps:
      - run: |
          if [[ ("${{ needs.backend.result }}" != "success" && "${{ needs.backend.result }}" != "skipped") || \
            ("${{ needs.frontend.result }}" != "success" && "${{ needs.frontend.result }}" != "skipped") || \
            ("${{ needs.opengrep.result }}" != "success" && "${{ needs.opengrep.result }}" != "skipped") ]]; then
          echo "❌ Failed :( Please check frontend, backend, or OpenGrep !!"
            exit 1
          fi
          echo "✅ All good :)"
