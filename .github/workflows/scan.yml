name: "Scan"

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '13 13 * * *'

permissions:
  contents: read

jobs:
  tools:
    name: tools/scan/${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: ghcr.io/umami-software/umami:latest, project: umami }
          - { image: outlinewiki/outline:latest, project: outline }
          - { image: databasus/databasus:latest, project: databasus }
          - { image: ghcr.io/immich-app/immich-server:release, project: immich }
          - { image: coollabsio/coolify:latest, project: coolify }
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
    - name: image/sbom
      id: "sbom"
      uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26
      with:
        image: ${{ matrix.image }}
        output-file: /tmp/sbom.json
        format: spdx-json
        upload-artifact: false
    - name: sbom/upload
      shell: bash
      env:
        DTRACK_URL: https://dtrack.louhaidia.info
        DTRACK_API_KEY: ${{ secrets.DTRACK_API_KEY }}
        SBOM_FILE: /tmp/sbom.json
      run: |
        payload="$(mktemp)"
        trap 'rm -f "$payload"' EXIT
        base64 -w 0 "$SBOM_FILE" \
          | jq -Rs --arg pn "${{ matrix.project }}" --arg pv "latest" \
              '{projectName:$pn, projectVersion:$pv, autoCreate:false, bom:.}' \
          > "$payload"
        curl -sS -f -X PUT "${DTRACK_URL}/api/v1/bom" \
             -H "X-Api-Key: ${DTRACK_API_KEY}" \
             -H "Content-Type: application/json" \
             --data-binary "@${payload}"

  docker:
    name: docker/scan/${{ matrix.docker_image }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        docker_image: [frontend, backend]
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
    - name: checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
    - name: docker/setup
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
    - name: dockerfile/scan
      uses: bridgecrewio/checkov-action@7b972723c44fb3d256283fac96fae5d7c1894bb7
      with:
        output_format: cli,sarif
        output_file_path: console,results-${{ matrix.docker_image }}.sarif
        file: './${{ matrix.docker_image }}/Dockerfile'
        framework: "dockerfile"
        quiet: true
        soft_fail: true
    - name: dockerfile/codeql/upload
      uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a
      with:
        sarif_file: results-${{ matrix.docker_image }}.sarif
    - name: dockerfile/build
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
      with:
        context: './${{ matrix.docker_image }}/'
        push: false
        tags: blog:${{ matrix.docker_image }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        outputs: type=docker
    - name: image/sbom
      id: "sbom"
      uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26
      with:
        image: 'blog:${{ matrix.docker_image }}'
        output-file: /tmp/blog-${{ matrix.docker_image }}.sbom.json
        format: spdx-json
        upload-artifact: false
    - name: image/sbom/upload
      shell: bash
      env:
        DTRACK_URL: https://dtrack.louhaidia.info
        DTRACK_API_KEY: ${{ secrets.DTRACK_API_KEY }}
        SBOM_FILE: /tmp/blog-${{ matrix.docker_image }}.sbom.json
      run: |
        payload="$(mktemp)"
        trap 'rm -f "$payload"' EXIT
        base64 -w 0 "$SBOM_FILE" \
          | jq -Rs --arg pn "elmouatassim-blog-${{ matrix.docker_image }}" --arg pv "latest" \
              '{projectName:$pn, projectVersion:$pv, autoCreate:false, bom:.}' \
          > "$payload"
        curl -sS -f -X PUT "${DTRACK_URL}/api/v1/bom" \
             -H "X-Api-Key: ${DTRACK_API_KEY}" \
             -H "Content-Type: application/json" \
             --data-binary "@${payload}"

  analyze:
    name: codeql/scan/${{ matrix.language }}
    runs-on: ubuntu-slim
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python]

    steps:
    - name: checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
    - name: Initialize CodeQL
      uses: github/codeql-action/init@7188fc363630916deb702c7fdcf4e481b751f97a
      with:
        languages: ${{ matrix.language }}
        tools: linked
        build-mode: none
        config-file: ./.github/codeql/${{ matrix.language }}-config.yml
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a
      with:
        category: "/language:${{matrix.language}}"
