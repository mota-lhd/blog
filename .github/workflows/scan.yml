name: "Scan"

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '13 13 * * *'

permissions:
  contents: read

jobs:
  tools:
    name: tools/scan/${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: ghcr.io/umami-software/umami:latest, project: 4c8465d0-f77a-4622-81e8-57d21fccd5af }
          - { image: outlinewiki/outline:latest, project: 9ede34a9-9c7b-45c0-938b-77589016d8ef }
          - { image: databasus/databasus:latest, project: 0c5094d1-0135-4090-8f2b-b08fe14906d9 }
          - { image: ghcr.io/immich-app/immich-server:release, project: bf723b5e-4ec8-4a0a-9961-4faacabd2797 }
          - { image: coollabsio/coolify:latest, project: baf00f56-6832-4f08-b192-7f418ae74d5e }
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
    - name: sbom
      run: |
        docker run --rm \
          -e CDXGEN_DEBUG_MODE=debug \
          -v /tmp:/tmp -t ghcr.io/cdxgen/cdxgen-bun:master \
          -v ${{ github.workspace }}:/app:rw \
          -t ghcr.io/cyclonedx/cdxgen:latest \
          -o /app/sbom.json \
          -t docker \
          --deep \
          -r /app \
          --exclude "/usr/bin/**" --exclude "/usr/sbin/**" \
          --exclude "/bin/**" --exclude "/sbin/**" \
          --exclude "/lib/**" --exclude "/etc/**" \
          --required-only \
          --filter "pkg:generic" \
          --server-url "https://dtrack.louhaidia.info" \
          --api-key "${{ secrets.DTRACK_API_KEY }}" \
          --project-id "${{ matrix.project }}" \
          --project-version "latest" \
          ${{ matrix.image }}

  docker:
    name: docker/scan/${{ matrix.docker_image }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        docker_image: [frontend, backend]
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
    - name: checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
    - name: docker/setup
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
    - name: dockerfile/scan
      uses: bridgecrewio/checkov-action@7b972723c44fb3d256283fac96fae5d7c1894bb7
      with:
        output_format: cli,sarif
        output_file_path: console,results-${{ matrix.docker_image }}.sarif
        file: './${{ matrix.docker_image }}/Dockerfile'
        framework: "dockerfile"
        quiet: true
        soft_fail: true
    - name: dockerfile/codeql/upload
      uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a
      with:
        sarif_file: results-${{ matrix.docker_image }}.sarif
    - name: dockerfile/build
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
      with:
        context: './${{ matrix.docker_image }}/'
        push: false
        tags: blog:${{ matrix.docker_image }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        outputs: type=docker

    - name: cdxgen/download
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release download v13.1.0 \
          --repo cdxgen/cdxgen \
          --pattern 'cdxgen-linux-amd64' \
          --pattern 'cdxgen-linux-amd64.sha256'
        sha256sum -c cdxgen-linux-amd64.sha256
        chmod +x cdxgen-linux-amd64
        ./cdxgen-linux-amd64 --version

    - name: Generate SBOM
      run: |
        ./cdxgen-linux-amd64 \
          -t docker \
          -o /tmp/blog-${{ matrix.docker_image }}.sbom.json \
          blog:${{ matrix.docker_image }}

    - name: image/sbom/upload
      shell: bash
      env:
        DTRACK_URL: https://dtrack.louhaidia.info
        DTRACK_API_KEY: ${{ secrets.DTRACK_API_KEY }}
        SBOM_FILE: /tmp/blog-${{ matrix.docker_image }}.sbom.json
      run: |
        payload="$(mktemp)"
        trap 'rm -f "$payload"' EXIT
        base64 -w 0 "$SBOM_FILE" \
          | jq -Rs --arg pn "elmouatassim-blog-${{ matrix.docker_image }}" --arg pv "latest" \
              '{projectName:$pn, projectVersion:$pv, autoCreate:false, bom:.}' \
          > "$payload"
        curl -sS -f -X PUT "${DTRACK_URL}/api/v1/bom" \
             -H "X-Api-Key: ${DTRACK_API_KEY}" \
             -H "Content-Type: application/json" \
             --data-binary "@${payload}"

  analyze:
    name: codeql/scan/${{ matrix.language }}
    runs-on: ubuntu-slim
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python]

    steps:
    - name: checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
    - name: Initialize CodeQL
      uses: github/codeql-action/init@7188fc363630916deb702c7fdcf4e481b751f97a
      with:
        languages: ${{ matrix.language }}
        tools: linked
        build-mode: none
        config-file: ./.github/codeql/${{ matrix.language }}-config.yml
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a
      with:
        category: "/language:${{matrix.language}}"
