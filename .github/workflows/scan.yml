name: "Scan"

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '13 13 * * *'

permissions:
  contents: read

jobs:
  docker:
    name: docker/build/${{ matrix.docker_image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        docker_image: [frontend, backend]

    steps:
    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: docker/setup
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: docker/login
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: dockerfile/scan
      uses: bridgecrewio/checkov-action@b782b35c8411ff565b881fba67ceebdb426d7dc4 # v3.4.11
      with:
        output_format: cli,sarif
        output_file_path: console,results-${{ matrix.docker_image }}.sarif
        file: './${{ matrix.docker_image }}/Dockerfile'
        framework: "dockerfile"
        quiet: true
        soft_fail: true
    - name: dockerfile/codeql/upload
      uses: github/codeql-action/upload-sarif@38112626f97ac1fd7acf3df7ebca51f4677c1b38 # v2.27.6
      with:
        sarif_file: results-${{ matrix.docker_image }}.sarif
    - name: dockerfile/build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: './${{ matrix.docker_image }}/'
        push: true
        tags: ghcr.io/${{ github.repository }}/blog-${{ matrix.docker_image }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

  analyze:
    name: opengrep/scan/${{ matrix.language }}
    runs-on: ubuntu-slim
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: yaml
            scan_path: .github/workflows .github/dependabot.yml
            scan_args: "--include '*.yml' --include '*.yaml'"
            sarif_file: opengrep-actions.sarif
          - language: javascript
            scan_path: frontend
            scan_args: "--include '*.js' --include '*.mjs' --include '*.html'"
            sarif_file: opengrep-frontend.sarif
          - language: python
            scan_path: backend
            scan_args: "--include '*.py'"
            sarif_file: opengrep-backend.sarif

    steps:
    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: opengrep/install
      env:
        OPENGREP_VERSION: v2.1.0
      run: |
        mkdir -p "$RUNNER_TEMP/opengrep"
        curl -fsSL \
          -o "$RUNNER_TEMP/opengrep/opengrep" \
          "https://github.com/opengrep/opengrep/releases/download/${OPENGREP_VERSION}/opengrep_linux_x86"
        chmod +x "$RUNNER_TEMP/opengrep/opengrep"
        echo "$RUNNER_TEMP/opengrep" >> "$GITHUB_PATH"
    - name: opengrep/scan
      continue-on-error: true
      run: |
        opengrep scan \
          --config auto \
          --taint-intrafile \
          ${{ matrix.scan_args }} \
          --sarif-output="${{ matrix.sarif_file }}" \
          ${{ matrix.scan_path }}
    - name: opengrep/upload
      if: always()
      uses: github/codeql-action/upload-sarif@38112626f97ac1fd7acf3df7ebca51f4677c1b38 # v2.27.6
      with:
        sarif_file: ${{ matrix.sarif_file }}
        category: "/opengrep:${{ matrix.language }}"
